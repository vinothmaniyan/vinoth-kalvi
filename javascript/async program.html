<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>async program call back function</title>
    <script>
        document.write("<h1> start </h1>");
        setTimeout(()=>{
            document.write("<h1> result</h1>");

        },4000);
        document.write("<h1>end</h1>");
    </script>
    <!-- refer pannanum call back function nu solluvanga
    first start end  varum aprm endla4 sec irunthu result varum
-->

</head>

</body>
</html>
