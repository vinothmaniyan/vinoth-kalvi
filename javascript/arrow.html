<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arrow</title>
    <script type="text/javascript">
        // first method
        function show(){
                
            document.write("<br>arrow function clicked");

    
        }
        // second method
        disp=()=>{
            document.write(" <br>vinoth");
        }
        // events
        dis1=()=>{
            document.write("<h1>double clicked</h1>");

        }


    </script>
</head>
<body>
    <button onclick="show()">click me</button>
    <br>
    <br>
    <button onclick="disp()">clicked</button>
    <br>
    <br>
    <!-- events -->
    <button onclick="dis1()">double click</button>
    
</body>
</html>
