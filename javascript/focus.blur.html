<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>focus  , blur</title>
    <script type="text/javascript">
        test1=()=>{
            console.log("cursor inside");
            document.getElementById("t1").style.backgroundColor="green";
    
        }
        test2=()=>{
            console.log("cursor outside");
            document.getElementById("t1").style.backgroundColor="pink";
        }

    </script>
</head>
<body>
    <input type="text" id="t1" onfocus="test1()" onblur="test2()">
    
</body>
</html>
