<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jumping</title>
    <script>
        function disp()
        {
            for (var i=1;i<=100;i++)
            {
                
                // if(i==25)

                document.getElementById("res").innerHTML+=" "+i;
                if(i<=25)
                {
                    break;
                }
                
            }
        }
    </script>
</head>
<body>
    <button onclick="disp()">click </button>
    <div id="res"></div>

    
</body>
</html>
