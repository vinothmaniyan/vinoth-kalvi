<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simple if condition</title>
    <script type="text/javascript">
        findres=()=>{
            var m1=parseInt(document.getElementById("t1")).value;
        
        }
         if(m1 >34) {
            document.getElementById("ans").innerHTML="pass";
        }
         else{
            document.getElementById("ans").innerHTML="fail";

        
    }
    </script>
</head>
<body>
    <div id="ans">
    <input type="text" id="t1">
    <br>
    <br>
    <input type="button" onclick="findres()" value="result">
</div>
    
</body>
</html>
