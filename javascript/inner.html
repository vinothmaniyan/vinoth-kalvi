<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inner.html purpose </title>
    <script type="text/javascript">
        // ithoda purpose ore line la erase akama varum
        // parseInt use pannuna text ulla iruka string ah number ah mathi kudukum
      dis=()=>{
          var n1=document.getElementById("t1").value;
          var n2=document.getElementById("t2").value;
          var tot=parseInt(n1)+parseInt(n2);
          document.getElementById("res").innerHTML="total:"+tot;
      }
    </script>
</head>
<body>
    <div id="res">
        <input type="text" id="t1" placeholder="Enter Number 1"><br>
        <input type="text" id="t2" placeholder="Enter Number2"><br>
        <button onclick="dis()">Find Total</button>
        <input type="button" onclick="dis()" value="find total">
    </div>
    
</body>
</html>
