<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function show(){
            var n1=parseInt(document.getElementById("t1").value);
            var n2=parseInt(document.getElementById("t2").value);

       for(var i=n1; i<=n2; i++)
       {
        if(i%2===0) 
        //  2 vakuthal even illana odd athutha thku artham
        document.write(`<br><font color="green">${i}</font>`);
        else
        document.write(`<br><font color="red">${i}</font>`);
       }

        }
    </script>
</head>
<body>
    <input type="text" id="t1" placeholder="Enter Start Number">
    <br>
    <input type="text" id="t2" placeholder="Enter end Number">
    <br>
    <button onclick="show()">click</button>
    
    
</body>
</html>
