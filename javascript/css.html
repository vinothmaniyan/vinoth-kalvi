<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>template</title>
    <style>
        #main{
            width: 75%;
            height:310px;
            background-color: greenyellow;
            border: 5px inset rebeccapurple;
            margin: 12.5%;
            /* transform: scale();x y direction width height adjusment panikalam
             transform= translate(0px,65px) first x value second y value
            transform rotate=(-10 deg);apdina sanchu varum*/
            /* transform: rotate();ulla value kudutha rotate akum */
              }
        
            .sub1{
                display: flex;
                justify-content: space-between;
                margin-top: 10px;
            .sub1:hover{
                transform: rotate(360 deg);
                transition: all 3sec;
            

             }
                
            
            }
            .sub2{
                display: flex;
                justify-content: space-between;
                margin-top: 65px;

            }
            .sub3{
                display: flex;
                justify-content: space-between;
                margin-top:85px;


            }
    </style>
</head>
<body>
    
    <div id="main">
        <div class="sub1">
            <img src="one.jpg" width="80px" height="50px">
            <img src="one.jpg" width="80px" height="50px">
            <img src="one.jpg" width="80px" height="50px">
        </div>
        <div class="sub2">
            <img src="one.jpg" width="80px" height="50px">
            <img src="one.jpg" width="80px" height="50px">
            <img src="one.jpg" width="80px" height="50px">
        </div>
        <div class="sub3">
            <img src="one.jpg" width="80px" height="50px">
            <img src="one.jpg" width="80px" height="50px">
            <img src="one.jpg" width="80px" height="50px">
        </div>
    </div>
    
    
</body>
</html>
