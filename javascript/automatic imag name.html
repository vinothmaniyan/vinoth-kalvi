<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>automatic img</title>
    <style>
        div{
            display: flex;
            align-items: center;
        }
    </style>
    <script>
        var imgarr=["one.jpg","ok.jpg","teri.jpg","two.jpg","one.jpg"];
        var i=0;
        function show(){
            if(i<imgarr.length-1)
            {
                i++;

            }
            else{
                i=0;
            }
            document.getElementById("imgid").src="./img/"+imgarr[i];
            document.getElementById("imgname").innerHTML="./img/"+imgarr[i];
            setTimeout(show,500);
        }
    </script>
</head>
<body onload="show()">
    <div>
    <img id="imgid" src="" width="500" height="300">
    <span id="imgname"></span>
    </div>
    <!-- <button onclick="show()">next image</button> -->
</body>
</html>
