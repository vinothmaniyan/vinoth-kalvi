<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>call backfunction two konajm vera mari </title>
    <script type="text/javascript">
        function show(){
            document.getElementById("r1").innerHTML="line1";
            document.getElementById("r2").innerHTML="line2";
            setTimeout(()=>{
                alert("this is alert message one");
            },7000);
            document.getElementById("r3").innerHTML="line3";
            document.getElementById("r4").innerHTML="line4";
            setTimeout(()=>{
                alert("this is alert message two");
            },2000);
            document.getElementById("r5").innerHTML="line5";
            document.getElementById("r6").innerHTML="line6";
        }
    </script>
</head>
<body>
    <button onclick="show()">click me</button>
    <div id="r1"></div>
    <div id="r2"></div>
    <div id="r3"></div>
    <div id="r4"></div>
    <div id="r5"></div>
    <div id="r6"></div>
    
    
</body>
</html>
