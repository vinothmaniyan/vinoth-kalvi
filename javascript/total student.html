<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>total students</title>
    <script type="text/javascript">
        findres=()=>{
            var m1=parseFloat(document.getElementById("mark1").value);
            var m2=parseFloat(document.getElementById("mark2").value);
            var m3=parseFloat(document.getElementById("mark3").value);
            var m4=parseFloat(document.getElementById("mark4").value);
            var m5=parseFloat(document.getElementById("mark5").value);
            var tot=m1+m2+m3+m4+m5;
            var avg=tot/50;
            var res="";
            var gra="";
            if(m1>34 && m2>34 && m3>34 && m4>34 && m5>34)
            {
                res="pass";
            }
            else{
                res="fail";
            }
            if(res==="pass")
            {
                if(avg>=85)
                {grad="out standing";}
            else if(avg>=75){
                gra="excellent";
            }
            else if{
                (avg >=65)
                {grad="very good"}
             }
            }
        }


    </script>
</head>
<body>
    
    <input type="text" id="mark1" placeholder="Enter Your Mark">
    <input type="text" id="mark2" placeholder="Enter Your Mark">
    <input type="text" id="mark3" placeholder="Enter Your Mark">
    <input type="text" id="mark4" placeholder="Enter Your Mark">
    <input type="text" id="mark5" placeholder="Enter Your Mark">
    <br>
    <input type="button" onclick="findres()" value="find total ave res grade">

<div id="ans1"></div>

</body>
</html>
