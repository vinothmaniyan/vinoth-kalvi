<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>important patha purium</title>
    <style>
        #main{
            position: relative;
            /* margin-left: 12.5%; */
            width: 75%;
            height:400px;
            background-color: greenyellow;
            border: 5px inset rebeccapurple;
            transform: translate(12.5%,12.5%);
        }
        #sd{
            width: 80px;
            height: 80px;
            position: absolute;
        }
        .sub1{
            background-color: red;
            top: 0;
            left: 0;

        }
        .sub2{
            background-color:green;
            top: 0;
            left:50%;
            transform: translate(-50%,0);
        }
        .sub3{
            background-color:yellow;
            top: 0;
            right: 0;
        }
        .sub4{
            background-color: pink;
            top: 50%;
            left: 0;
            transform: translate(0,-50%);
        }
        .sub5{
            background-color: pink;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%); 
            /* o x value -50 y value */
        }
        .sub6{
            background-color:orange;
            top:50%;
            right:0%;
            transform: translate(0,-50%);
            
        }
        .sub7{
            background-color:silver;
            bottom:0;
            left: 0;
        }

        .sub8{
            background-color: black;
            bottom: 0;
            left: 50%;
            transform: translate(-50%,0);
        }
        .sub9{
            background-color:purple;
            bottom: 0;
            right: 0;
        }


             
    </style>
</head>
<body>
    <div id="main">
        <div class="sub1" id="sd"></div>
        <div class="sub2" id="sd"></div>
        <div class="sub3" id="sd"></div>

        <div class="sub4" id="sd"></div>

        <div class="sub5" id="sd"></div>

        <div class="sub6" id="sd"></div>
        <div class="sub7" id="sd"></div>
        <div class="sub8" id="sd"></div>
        <div class="sub9" id="sd"></div>

        
    </div>
    
</body>
</html>
