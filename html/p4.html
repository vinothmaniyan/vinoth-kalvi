<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sample four</title>
    <style>
        .loginform form{
            max-width: 400px;
            margin: auto;
            background-color: tan;
            box-shadow: 0 10px 10px;

        }
        .loginform form fieldset{
            border: 0 none;
            margin: 0;
            padding: 20px;
        }
        .loginform form legend,
        .loginform form fieldset input,button{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
            margin-top: 2px;
            margin-bottom: 2px;
        }
        .loginform form legend{
            background-color: coral;
            border-top: 0  none;
            color: white;
            display: table-cell;
            padding: 10px 20px;
            width: auto;
        }
        input{
            border-radius: 5px;
        }
        button{
            border-radius: 5px;
        }

    </style>
</head>
<body>
    <div class="loginform">
        <form>
            <legend>User Login</legend>
            <fieldset>
                <input placeholder="Username" type="text">
                <input placeholder="Password" type="password">
                <button type="submit">Login</button>
            </fieldset>
        </form>
    </div>

    
</body>
</html>
